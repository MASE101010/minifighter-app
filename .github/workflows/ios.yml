name: Build iPhone app (upload to TestFlight / App Store Connect)
# Manual only: Mac build minutes cost 10x on private repos. Run from Actions > this workflow > Run workflow.
# Runs on: Run workflow (manual), or a push whose commit message contains [release].
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect (TestFlight)'
        type: boolean
        default: true
      submit:
        description: 'Also send to App Review (after TestFlight processing)'
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-26
    outputs:
      uploaded: ${{ steps.up.outputs.done }}
      version: ${{ steps.v.outputs.name }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "name=$(tr -d '[:space:]' < version.txt)" >> $GITHUB_OUTPUT
      - name: Newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci && pip3 install --break-system-packages pillow >/dev/null
      - name: Web build + sync to iPhone project
        run: npm run build:ios
      - name: Check secrets
        id: sec
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 || secrets.APPSTORE_KEY_P8 }}
          T: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ok=true; for v in K I P T; do [ -n "${!v}" ] || ok=false; done
          echo "ok=$ok" >> $GITHUB_OUTPUT
          $ok || echo "::warning::Apple secrets not set yet (ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 / APPLE_TEAM_ID). Running a compile check only."
      - name: Compile check (no Apple account needed)
        if: steps.sec.outputs.ok != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO \
            | tail -40; test ${PIPESTATUS[0]} -eq 0
          echo "Compile OK. Add the 4 Apple secrets to build and upload for real."
      - name: App Store Connect API key
        if: steps.sec.outputs.ok == 'true'
        env:
          P: ${{ secrets.ASC_KEY_P8 || secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          ASC_KEY_P8="$P" python3 build/p8.py > ~/.appstoreconnect/private_keys/AuthKey.p8
          pip3 install --break-system-packages pyjwt cryptography requests >/dev/null
      - name: App Store certificate + profile (stored, reused)
        id: sign
        if: steps.sec.outputs.ok == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.APPSTORE_KEY_P8 }}
        run: python3 build/asc_sign.py create
      - name: Keychain
        if: steps.sec.outputs.ok == 'true'
        run: |
          KC=$RUNNER_TEMP/mf.keychain-db; KP=$(uuidgen)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import $RUNNER_TEMP/signing.p12 -P "${{ steps.sign.outputs.p12_password }}" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
      - name: Archive (App Store signing)
        if: steps.sec.outputs.ok == 'true'
        env:
          T: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 build/ios_manual_sign.py "$T" "${{ steps.sign.outputs.profile_name }}"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/MiniFighter.xcarchive archive \
            MARKETING_VERSION=${{ steps.v.outputs.name }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tail -60; test ${PIPESTATUS[0]} -eq 0
      - name: Export and upload to App Store Connect
        id: up
        if: steps.sec.outputs.ok == 'true' && (github.event_name == 'push' || inputs.upload)
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          T: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$T</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.sapirproductions.minifighter</key><string>${{ steps.sign.outputs.profile_name }}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          sed -i '' 's/^          //' $RUNNER_TEMP/ExportOptions.plist
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/MiniFighter.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/out \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey.p8 \
            -authenticationKeyID "$K" -authenticationKeyIssuerID "$I"
          echo "done=true" >> $GITHUB_OUTPUT
          echo "Uploaded ${{ steps.v.outputs.name }} (${{ github.run_number }}). It shows up in TestFlight after Apple processes it (5-30 min)."
      - name: Save new signing certificate to the repo (encrypted)
        if: steps.sign.outputs.new_cert == 'true'
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add store/signing && git commit -m "Store encrypted App Store signing certificate [skip ci]" && git pull --rebase -q && git push
      - name: Remove key
        if: always()
        run: rm -rf ~/.appstoreconnect $RUNNER_TEMP/signing.p12; security delete-keychain $RUNNER_TEMP/mf.keychain-db 2>/dev/null || true

  # Waiting for Apple's processing happens on a cheap Linux machine, not on the Mac
  submit:
    needs: ios
    if: needs.ios.outputs.uploaded == 'true' && (github.event_name == 'push' || inputs.submit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests >/dev/null
      - name: Send to App Review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.APPSTORE_KEY_P8 }}
          VERSION: ${{ needs.ios.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: python3 build/asc_submit.py
