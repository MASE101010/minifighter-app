name: App Store in-app purchases (2.0 catalog)
# Creates / updates every product in store/iap_products.json in App Store Connect. Never submits anything for review.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these product ids (space separated, empty = all)'
        type: string
        default: ''
      age_rating:
        description: 'Also set the 2.0 age rating answers (needs the 2.0 version in Prepare for Submission)'
        type: boolean
        default: true
      retire_premium:
        description: 'Remove premium_all from sale (ONLY after 2.0 is live; buyers can still restore)'
        type: boolean
        default: false
      status_only:
        description: 'Only print the product status table'
        type: boolean
        default: false
jobs:
  iap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests >/dev/null
      - name: Create / update in-app purchases
        if: ${{ !inputs.status_only }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.APPSTORE_KEY_P8 }}
          IAP_ONLY: ${{ inputs.only }}
          IAP_AGE_RATING: ${{ inputs.age_rating }}
          IAP_RETIRE_PREMIUM: ${{ inputs.retire_premium }}
        run: python3 build/asc_iap.py
      - name: Status
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.APPSTORE_KEY_P8 }}
        run: python3 build/asc_iap_status.py
