name: Build Android app (AAB for Google Play)
# Every push builds a signed AAB + APK. A commit message containing [release] (or Run workflow with publish)
# also uploads the AAB to Google Play production, when the PLAY_SERVICE_ACCOUNT_JSON secret exists.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Google Play (production)'
        type: boolean
        default: false
      stash:
        description: 'Also push the AAB to the aab-tmp branch (for a manual upload through the browser)'
        type: boolean
        default: false
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Version
        id: v
        run: echo "name=$(tr -d '[:space:]' < version.txt)" >> $GITHUB_OUTPUT
      - name: Install
        run: npm ci
      - name: Web build + sync to Android (live ads)
        run: npm run build
      - name: Signing key (from encrypted secrets)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KSP" "$KA" "$KP" > android/keystore.properties
      - name: Build signed AAB
        working-directory: android
        env:
          MF_VERSION_CODE: ${{ github.run_number }}
          MF_VERSION_NAME: ${{ steps.v.outputs.name }}
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk mini-fighter-v${{ steps.v.outputs.name }}-${{ github.run_number }}.apk
      - name: Remove signing files
        if: always()
        run: rm -f android/app/upload.jks android/keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: mini-fighter-v${{ steps.v.outputs.name }}-${{ github.run_number }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: mini-fighter-v${{ steps.v.outputs.name }}-${{ github.run_number }}-apk
          path: mini-fighter-v${{ steps.v.outputs.name }}-${{ github.run_number }}.apk
          retention-days: 90
      - name: AAB to the aab-tmp branch
        if: inputs.stash == true
        run: |
          d=$(mktemp -d); cp android/app/build/outputs/bundle/release/app-release.aab $d/minifighter-${{ steps.v.outputs.name }}-${{ github.run_number }}.aab
          cd $d; git init -q; git checkout -q -b aab-tmp
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A; git commit -q -m "AAB ${{ steps.v.outputs.name }} (${{ github.run_number }})"
          git push -q -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} aab-tmp
          ls -la
      - name: Publish?
        id: pub
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          want=false
          [ "${{ inputs.publish }}" = "true" ] && want=true
          case "$MSG" in *"[release]"*) want=true;; esac
          if $want && [ -z "$SA" ]; then echo "::warning::PLAY_SERVICE_ACCOUNT_JSON secret missing, skipping Google Play upload"; want=false; fi
          echo "go=$want" >> $GITHUB_OUTPUT
      - name: Release notes for Google Play
        if: steps.pub.outputs.go == 'true'
        run: mkdir -p whatsnew && cut -c1-500 release_notes/he.txt > whatsnew/whatsnew-he-IL
      - name: Upload to Google Play (production)
        if: steps.pub.outputs.go == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sapirproductions.minifighter
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.v.outputs.name }} (${{ github.run_number }})
          track: production
          status: completed
          whatsNewDirectory: whatsnew
